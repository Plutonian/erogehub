<nz-collapse nzAccordion>
    <nz-collapse-panel [nzHeader]="'Brand'">
        <app-group-brand [brandGroup]="brandGroup" (onBrandSelected)="onBrandSelected.emit($event)"></app-group-brand>
    </nz-collapse-panel>
    <nz-collapse-panel [nzHeader]="'Tag'">
        <app-group-tag [tagGroup]="tagGroup" (onTagSelect)="onTagSelect.emit($event)"></app-group-tag>
    </nz-collapse-panel>
    <nz-collapse-panel [nzHeader]="'Date'">
        <app-group-date [dateGroup]="dateGroup" (onDateSelect)="onDateSelect.emit($event)"></app-group-date>
    </nz-collapse-panel>

    <nz-collapse-panel [nzHeader]="'Emotion'">
        <app-group-emotion [emotionGroup]="emotionGroup"
                           (onEmotionSelected)="onEmotionSelected.emit($event)"></app-group-emotion>
    </nz-collapse-panel>

    <nz-collapse-panel nzHeader="Location">
        <app-group-location [locationGroup]="locationGroup"
                            (onLocationSelected)="onLocationSelected.emit($event)"></app-group-location>
    </nz-collapse-panel>

    <nz-collapse-panel [nzHeader]="'PlayState'">
        <app-group-playstate [playStateGroup]="playStateGroup"
                            (onPlayStateSelected)="onPlayStateSelected.emit($event)"></app-group-playstate>
    </nz-collapse-panel>

    <nz-collapse-panel [nzHeader]="'CV'">
        <app-group-cv [cvGroup]="cvGroup" (onCVSelected)="onCVSelect.emit($event)"></app-group-cv>
    </nz-collapse-panel>
    <nz-collapse-panel [nzHeader]="'Star'">
        <app-group-star [starGroup]="starGroup" (onStarSelect)="onStarSelect.emit($event)"></app-group-star>
    </nz-collapse-panel>
</nz-collapse>
