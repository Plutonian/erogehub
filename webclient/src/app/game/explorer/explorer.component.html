<nz-layout>
    <nz-content>
        @if (gamelist?.length > 0) {
            <app-game-listview [gamelist]="gamelist" (onGameDelete)="onGameDelete($event)"></app-game-listview>

        } @else {
            <H3>Empty</H3>
        }

    </nz-content>
    <nz-footer class="list-footer">
        <div class="pagination-section">
            <span class="total-count">共 {{ total }} 条</span>
            <nz-pagination (nzPageIndexChange)="pageIndexChange($event)"
                           *ngIf="total>pageItemSize"
                           [nzPageIndex]="page"
                           [nzPageSize]="pageItemSize"
                           [nzTotal]="total"
                           nzSimple
                           class="pagination"></nz-pagination>
        </div>
    </nz-footer>
</nz-layout>
