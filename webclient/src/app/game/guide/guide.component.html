<form #form="ngForm" (submit)="onSubmit(form)" class="flex_row">
  <input nz-input name="searchKey" [(ngModel)]="searchKey" class="flex_grow" required placeholder="ネイムを入れてください"/>
    <button nz-button nzType="primary" type="submit" value="Search" [disabled]="form.invalid">Search</button>
</form>

<section *ngIf="guideList" class="flex_column">
  <ng-template [ngIf]="guideList.length>0" [ngIfElse]="noGuide">
    <div *ngFor="let guide of guideList" class="flex_row">
      <span>[{{guide.from}}]</span>
      <a target="_blank" [href]="guide.href">{{guide.title}}</a>
    </div>
  </ng-template>

  <ng-template #noGuide>
    <H3>No Guide</H3>
  </ng-template>
</section>
