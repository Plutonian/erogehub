<span [class.hope]="game._emotion ==Emotion.HOPE"
      [class.like]="game._emotion ==Emotion.LIKE"
      nz-popover [nzPopoverContent]="commands">
<i nz-icon nzType="heart" nzTheme="fill"></i>
</span>
<ng-template #commands>
    <nz-radio-group [(ngModel)]="game._emotion" nzButtonStyle="solid" (ngModelChange)="updateEmotion()">
        <label *ngFor="let emotion of emotions" nz-radio-button nzValue="{{emotion}}">{{ emotion |emotionJP }}</label>
    </nz-radio-group>
</ng-template>
