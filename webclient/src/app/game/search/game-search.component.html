<nz-layout>
    <!-- 左侧搜索条件 -->
    <nz-sider [nzWidth]="350">
        <nz-card nzTitle="Search" [nzExtra]="selectMark">

            <!-- 日期范围筛选 -->
            <div class="date-range-section">
                <div class="date-range-header">
                    <span class="date-range-label">发布日期</span>
                    <nz-select nzSize="small" [(ngModel)]="selectedDatePreset" (ngModelChange)="onDatePresetChange()" class="date-range-preset-select">
                        <nz-option *ngFor="let preset of dateRangePresets" [nzValue]="preset.key" [nzLabel]="preset.label"></nz-option>
                    </nz-select>
                </div>
                <div *ngIf="selectedDatePreset === 'CUSTOM'" class="date-range-inputs">
                    <input type="date" [(ngModel)]="customDateRange.startDate" (ngModelChange)="onCustomDateChange()" nz-input nzSize="small" class="date-input"/>
                    <span class="date-separator">~</span>
                    <input type="date" [(ngModel)]="customDateRange.endDate" (ngModelChange)="onCustomDateChange()" nz-input nzSize="small" class="date-input"/>
                </div>
                <div *ngIf="selectedDatePreset !== 'ALL' && selectedDatePreset !== 'CUSTOM'" class="date-range-info">
                    <small>当前范围: {{currentDateRange.startDate}} ~ {{currentDateRange.endDate}}</small>
                </div>
            </div>

            <nz-collapse>
                <nz-collapse-panel [nzActive]="true" nzHeader="包含" class="all_width" [nzExtra]="addIncludeSearchOpt">
                    <div class="scrollableY">
                        <div *ngFor="let searchOpt of includedAdvSearchOpts">
                            <app-search-page-search-opt-item [searchOpt]="searchOpt" (onSwap)="swapSearchOpt(searchOpt,FILTER.Include)" (onRemove)="removeSearchOpt(searchOpt,FILTER.Include)"></app-search-page-search-opt-item>
                        </div>
                    </div>
                </nz-collapse-panel>

                <nz-collapse-panel [nzActive]="true" nzHeader="排除" class="all_width" [nzExtra]="addExcludeSearchOpt">
                    <div class="scrollableY">
                        <div *ngFor="let searchOpt of excludedAdvSearchOpts">
                            <app-search-page-search-opt-item [searchOpt]="searchOpt" (onSwap)="swapSearchOpt(searchOpt,FILTER.Exclude)" (onRemove)="removeSearchOpt(searchOpt,FILTER.Exclude)"></app-search-page-search-opt-item>
                        </div>
                    </div>
                </nz-collapse-panel>
            </nz-collapse>
        </nz-card>
    </nz-sider>

    <!-- 中间内容区 -->
    <nz-content>
        <app-explorer [gamelist]="gamelist" [page]="page" [total]="total" [pageItemSize]="pageItemSize" (pageChange)="onPageIndexChange($event)" class="flex_grow"></app-explorer>
    </nz-content>

    <!-- 右侧聚合面板 -->
    <nz-sider>
        <app-aggregate-game [emotionGroup]="emotionGroup"
                           [tagGroup]="tagGroup"
                           [brandGroup]="brandGroup"
                           [cvGroup]="cvGroup"
                           [starGroup]="starGroup"
                           [locationGroup]="locationGroup"
                           [dateGroup]="dateGroup"
                           (onBrandSelected)="onBrandSelected($event)"
                           (onTagSelect)="onTagSelect($event)"
                           (onEmotionSelected)="onEmotionSelected($event)"
                           (onLocationSelected)="onLocationSelected($event)"
                           (onCVSelect)="onCVSelect($event)"
                           (onStarSelect)="onStarSelect($event)">
        </app-aggregate-game>
    </nz-sider>
</nz-layout>

<ng-template #selectMark>
    <button (click)="handleSearchClick()" nz-button nzType="primary">Search</button>
</ng-template>

<ng-template #addIncludeSearchOpt>
    <button (click)="addDefaultSearchOpt(FILTER.Include);$event.stopPropagation()" nz-button nzType="primary"> + </button>
</ng-template>


<ng-template #addExcludeSearchOpt>
    <button (click)="addDefaultSearchOpt(FILTER.Exclude);$event.stopPropagation()" nz-button nzType="primary"> + </button>
</ng-template>
