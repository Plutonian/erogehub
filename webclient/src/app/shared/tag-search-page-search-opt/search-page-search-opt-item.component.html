<div>
    <nz-input-group [nzAddOnAfter]="searchOptFilter" [nzAddOnBefore]="searchOptType" nzSize="large">
        <!-- 星级输入 -->
        @if (isStarInput(searchOpt.key)){
            <div style="padding: 8px 12px;" [class]="getInputClass()">
                <nz-rate [(ngModel)]="searchOpt.value" [disabled]="!searchOpt.enabled" [nzAllowClear]="true"></nz-rate>
            </div>
        }
        <!-- 下拉选择（情感/位置/状态） -->
        @else if (isSelectInput(searchOpt.key)){
            <nz-select [(ngModel)]="searchOpt.value" [disabled]="!searchOpt.enabled" [class]="getInputClass()" style="width: 120px">
                @switch (searchOpt.key){
                    @case (SEARCHTYPE.EMOTION){
                        <nz-option [nzValue]="Emotion.LIKE" nzLabel="好き"></nz-option>
                        <nz-option [nzValue]="Emotion.HOPE" nzLabel="気になり"></nz-option>
                        <nz-option [nzValue]="Emotion.NORMAL" nzLabel="..."></nz-option>
                        <nz-option [nzValue]="Emotion.HATE" nzLabel="嫌い"></nz-option>
                    }
                    @case (SEARCHTYPE.LOCATION){
                        <nz-option [nzValue]="Location.LOCAL" nzLabel="Local"></nz-option>
                        <nz-option [nzValue]="Location.REMOTE" nzLabel="Remote"></nz-option>
                    }
                    @case (SEARCHTYPE.PLAYSTATE){
                        <nz-option [nzValue]="PlayState.NOT_PLAY" nzLabel="..."></nz-option>
                        <nz-option [nzValue]="PlayState.PLAYING" nzLabel="進行中"></nz-option>
                        <nz-option [nzValue]="PlayState.PLAYED" nzLabel="プレイ済み"></nz-option>
                    }
                }
            </nz-select>
        }
        <!-- 文本输入 -->
        @else {
            <input [(ngModel)]="searchOpt.value" [class]="getInputClass()" [disabled]="!searchOpt.enabled" nz-input/>
        }
    </nz-input-group>
</div>
<ng-template #searchOptType>
    <nz-select [(ngModel)]="searchOpt.key" style="min-width: 80px" [disabled]="!searchOpt.enabled">
        <nz-option-group nzLabel="文本搜索">
            <nz-option [nzValue]="SEARCHTYPE.TEXT" nzLabel="全文检索"></nz-option>
            <nz-option [nzValue]="SEARCHTYPE.REGEX" nzLabel="Regex"></nz-option>
            <nz-option [nzValue]="SEARCHTYPE.TAG" nzLabel="Tag"></nz-option>
        </nz-option-group>
        <nz-option-group nzLabel="游戏属性">
            <nz-option [nzValue]="SEARCHTYPE.STAR" nzLabel="星级"></nz-option>
            <nz-option [nzValue]="SEARCHTYPE.EMOTION" nzLabel="情感"></nz-option>
            <nz-option [nzValue]="SEARCHTYPE.LOCATION" nzLabel="位置"></nz-option>
            <nz-option [nzValue]="SEARCHTYPE.PLAYSTATE" nzLabel="游玩状态"></nz-option>
        </nz-option-group>
        <nz-option-group nzLabel="人员">
            <nz-option [nzValue]="SEARCHTYPE.PAINTER" nzLabel="画师"></nz-option>
            <nz-option [nzValue]="SEARCHTYPE.WRITER" nzLabel="剧本作家"></nz-option>
            <nz-option [nzValue]="SEARCHTYPE.CV" nzLabel="声优"></nz-option>
            <nz-option [nzValue]="SEARCHTYPE.TRUECV" nzLabel="去马甲CV"></nz-option>
        </nz-option-group>
        <nz-option-group nzLabel="品牌">
            <nz-option [nzValue]="SEARCHTYPE.BRAND" nzLabel="品牌"></nz-option>
        </nz-option-group>
    </nz-select>
</ng-template>

<ng-template #searchOptFilter>
    <nz-switch [(ngModel)]="searchOpt.enabled" nzCheckedChildren="E" nzUnCheckedChildren="D"></nz-switch>
    <button (click)="swap()" nz-button><span nz-icon nzType="swap" nzTheme="outline" ></span></button>
    <button (click)="remove()" nz-button><span nz-icon
                                               nzTheme="outline"
                                               nzType="delete"
                                               style="color: red"></span>
    </button>
</ng-template>
